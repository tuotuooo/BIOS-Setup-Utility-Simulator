<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BIOS 下拉框交互自动测试</title>
<style>
  body { font-family: "Courier New", Consolas, monospace; padding: 20px; background: #222; color: #eee; }
  h1 { color: #0f0; }
  .test-suite { margin: 10px 0; padding: 10px; border: 1px solid #555; background: #333; }
  .test-case { padding: 5px 10px; margin: 2px 0; border-left: 3px solid #aaa; }
  .pass { border-left-color: #0f0; color: #0f0; }
  .fail { border-left-color: #f00; color: #f55; }
  .info { border-left-color: #0bf; color: #0bf; }
  #test-frame { width: 100%; height: 600px; border: 2px solid #0f0; margin: 10px 0; }
  .summary { font-size: 16px; margin-top: 20px; padding: 10px; background: #444; }
</style>
</head>
<body>
<h1>🔍 BIOS 下拉框交互自动测试</h1>
<div id="results"></div>
<iframe id="test-frame" src="DZ500SQ_bios_frontend.html"></iframe>

<script>
const results = document.getElementById('results');
const iframe = document.getElementById('test-frame');
let passCount = 0, failCount = 0;

function log(type, msg) {
  const div = document.createElement('div');
  div.className = 'test-case ' + type;
  div.textContent = `[${type.toUpperCase()}] ${msg}`;
  results.appendChild(div);
  if (type === 'pass') passCount++;
  if (type === 'fail') failCount++;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// 获取 iframe 内的 DOM
function getDoc() {
  return iframe.contentDocument || iframe.contentWindow.document;
}

function getWin() {
  return iframe.contentWindow;
}

// 查找 "选择语言" 行
function findLanguageRow() {
  const doc = getDoc();
  const rows = doc.querySelectorAll('.info-row');
  for (const row of rows) {
    const label = row.querySelector('.info-label');
    if (label && label.textContent.includes('选择语言')) {
      return row;
    }
  }
  return null;
}

// 触发鼠标事件
function triggerMouseEvent(element, eventType) {
  const doc = getDoc();
  const rect = element.getBoundingClientRect();
  const event = new MouseEvent(eventType, {
    bubbles: true,
    cancelable: true,
    view: getWin(),
    clientX: rect.left + rect.width / 2,
    clientY: rect.top + rect.height / 2,
    button: 0
  });
  element.dispatchEvent(event);
}

// 测试套件
async function runTests() {
  log('info', '等待 BIOS 页面加载...');
  await sleep(2000);

  const doc = getDoc();
  if (!doc || !doc.body) {
    log('fail', 'iframe 页面未加载，请检查路径 DZ500SQ_bios_frontend.html 是否正确');
    return;
  }
  log('pass', 'BIOS 页面已加载');

  // ===== 测试 1: 查找 "选择语言" 行 =====
  const langRow = findLanguageRow();
  if (!langRow) {
    log('fail', '未找到 "选择语言" 行');
    return;
  }
  log('pass', '找到 "选择语言" 行');

  const valSpan = langRow.querySelector('.info-value');
  if (!valSpan) {
    log('fail', '"选择语言" 行缺少 .info-value 元素');
    return;
  }
  log('info', `当前值: ${valSpan.textContent.trim()}`);

  // ===== 测试 2: 颜色检查 =====
  const labelSpan = langRow.querySelector('.info-label');
  const labelColor = getWin().getComputedStyle(labelSpan).color;
  const valueColor = getWin().getComputedStyle(valSpan).color;
  log('info', `Label 颜色: ${labelColor}`);
  log('info', `Value 颜色: ${valueColor}`);

  // ===== 测试 3: 鼠标点击展开下拉框 =====
  log('info', '点击值文字 <中文> 以展开下拉框...');
  triggerMouseEvent(valSpan, 'click');
  await sleep(300);

  const picker = doc.querySelector('#activeInlinePicker');
  if (!picker) {
    log('fail', '点击后未展开下拉框 (#activeInlinePicker 不存在)');
    return;
  }
  log('pass', '下拉框已展开');

  // 检查 picker 位置
  const pickerRect = picker.getBoundingClientRect();
  const valRect = valSpan.getBoundingClientRect();
  log('info', `Picker 位置: left=${pickerRect.left.toFixed(1)}, top=${pickerRect.top.toFixed(1)}`);
  log('info', `Value 位置: left=${valRect.left.toFixed(1)}, bottom=${valRect.bottom.toFixed(1)}`);

  const xOffset = Math.abs(pickerRect.left - valRect.left);
  const yOffset = Math.abs(pickerRect.top - valRect.bottom);
  if (xOffset < 20 && yOffset < 10) {
    log('pass', `下拉框位置正确 (x偏差 ${xOffset.toFixed(1)}px, y偏差 ${yOffset.toFixed(1)}px)`);
  } else {
    log('fail', `下拉框位置偏移过大 (x偏差 ${xOffset.toFixed(1)}px, y偏差 ${yOffset.toFixed(1)}px)`);
  }

  // ===== 测试 4: 检查选项是否存在 =====
  const options = picker.querySelectorAll('.inline-option');
  if (options.length === 0) {
    log('fail', '下拉框内没有选项');
    return;
  }
  log('pass', `下拉框内有 ${options.length} 个选项`);

  options.forEach((opt, i) => {
    log('info', `  选项 ${i}: "${opt.textContent.trim()}"`);
  });

  // ===== 测试 5: 鼠标悬停高亮 =====
  const englishOption = Array.from(options).find(opt => opt.textContent.includes('English'));
  if (englishOption) {
    log('info', '鼠标悬停到 <English> 选项...');
    triggerMouseEvent(englishOption, 'mouseenter');
    await sleep(100);
    const hasSelected = englishOption.classList.contains('selected');
    if (hasSelected) {
      log('pass', '悬停后 <English> 选项已高亮 (class="selected")');
    } else {
      log('fail', '悬停后 <English> 选项未高亮');
    }
  }

  // ===== 测试 6: 核心 - 鼠标点击选项完成切换 =====
  log('info', '点击 <English> 选项...');
  const oldValue = valSpan.textContent.trim();
  triggerMouseEvent(englishOption || options[1], 'click');
  await sleep(300);

  // 检查 picker 是否关闭
  const pickerAfterClick = doc.querySelector('#activeInlinePicker');
  if (pickerAfterClick) {
    log('fail', '点击选项后下拉框未关闭');
  } else {
    log('pass', '点击选项后下拉框已关闭');
  }

  // 检查值是否更新
  const newValue = valSpan.textContent.trim();
  if (newValue !== oldValue) {
    log('pass', `值已更新: "${oldValue}" → "${newValue}"`);
  } else {
    log('fail', `值未更新，仍为: "${oldValue}"`);
  }

  // ===== 测试 7: 键盘导航测试 =====
  log('info', '测试键盘导航...');
  // 先聚焦到选择语言行（模拟键盘↓导航）
  const keyEvent = new KeyboardEvent('keydown', {
    key: 'ArrowDown',
    bubbles: true,
    cancelable: true,
    view: getWin()
  });
  doc.dispatchEvent(keyEvent);
  await sleep(100);

  // 再次展开 picker
  triggerMouseEvent(valSpan, 'click');
  await sleep(200);
  const picker2 = doc.querySelector('#activeInlinePicker');
  if (picker2) {
    log('pass', '键盘导航后再次点击可展开下拉框');
    // 按 Esc 关闭
    const escEvent = new KeyboardEvent('keydown', {
      key: 'Escape',
      bubbles: true,
      cancelable: true,
      view: getWin()
    });
    doc.dispatchEvent(escEvent);
    await sleep(200);
    if (!doc.querySelector('#activeInlinePicker')) {
      log('pass', 'Esc 键可关闭下拉框');
    } else {
      log('fail', 'Esc 键未能关闭下拉框');
    }
  } else {
    log('fail', '键盘导航后无法展开下拉框');
  }

  // ===== 测试 8: 多次切换稳定性 =====
  log('info', '测试多次切换稳定性...');
  for (let i = 0; i < 3; i++) {
    triggerMouseEvent(valSpan, 'click');
    await sleep(200);
    const p = doc.querySelector('#activeInlinePicker');
    if (p) {
      const opts = p.querySelectorAll('.inline-option');
      if (opts.length > 0) {
        triggerMouseEvent(opts[0], 'click');
        await sleep(200);
      }
    }
  }
  log('pass', '多次切换完成，无崩溃');

  // ===== 总结 =====
  const summary = document.createElement('div');
  summary.className = 'summary';
  summary.innerHTML = `<strong>测试结果汇总</strong><br>
    ✅ 通过: ${passCount} 项<br>
    ❌ 失败: ${failCount} 项<br>
    总计: ${passCount + failCount} 项`;
  results.appendChild(summary);

  if (failCount === 0) {
    log('info', '🎉 所有测试全部通过！鼠标交互功能正常。');
  } else {
    log('info', `⚠️ 有 ${failCount} 项测试失败，请查看上方详情排查问题。`);
  }
}

// 页面加载后自动运行
iframe.onload = () => {
  setTimeout(runTests, 1000);
};
</script>
</body>
</html>
