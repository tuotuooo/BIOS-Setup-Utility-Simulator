<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>百敖ByoCore软件 V2.0 - DZ500SQ</title>
<style>
  /* ── 像素采样颜色变量（从frame_0003.jpg + frame_0012.jpg PIL精确提取） ═══ */
  :root {
    --title-bg:       #0000b8;  /* 标题栏背景 (0,0,184) */
    --title-text:     #7cb342;  /* 标题栏文字：老树叶的绿色 */
    --main-gray:      #aeaeae;  /* 主灰背景 (174,174,174) */
    --tab-bg:         #0000b8;  /* Tab栏背景：深蓝 */
    --tab-text:       #ffffff;  /* Tab未选中文字：白 */
    --tab-active-bg:  #aeaeae;  /* Tab选中背景：灰 */
    --tab-active-text:#0000b8;  /* Tab选中文字：蓝 */
    --label-text:     #323232;  /* 标签文字 (50,50,50) frame_0012 */
    --value-text:     #f0f0f0;  /* 值文字 (240,240,240) */
    --arrow-color:    #f0f0f0;  /* ▶符号 */
    --submenu-text:   #0000b8;  /* 子菜单文字 / 蓝色值文字 */
    --help-text:      #262626;  /* 帮助文字 (38,38,38) frame_0012 */
    --footer-bg:      #0000ae;  /* 底部栏背景 (0,0,174) frame_0012 */
    --footer-text:    #b7b6b8;  /* 底部栏文字 (183,182,184) frame_0012 */
    --copyright-bg:   #000000;  /* 版权背景 */
    --copyright-text: #cbcbcb;  /* 版权文字 (203,203,203) frame_0012 */
    --border-color:   #adb1ce;  /* 边框 */
    --selected-row:   #b9b9b9;  /* 选中行 */
    --divider-dark:   #0f0e47;  /* 深色分割线 */
    --focus-bg:       #a0a0c0;  /* 键盘焦点行背景 */
    /* 弹出选择器颜色 (frame_0012.jpg 精确提取) */
    --popup-border:   #0000b4;  /* 弹出框蓝色边框 (0,0,180) */
    --popup-bg:       #b4b4b5;  /* 弹出框灰色背景 (180,180,181) */
    --popup-unselected-text: #0000b4;  /* 未选中项蓝色文字 */
    --popup-selected-bg:    #0000b4;  /* 选中项蓝色背景 */
    --popup-selected-text:  #ffffff;  /* 选中项白色文字 */
    --bg:                   #aeaeae;  /* 全局背景色（与主灰背景一致） */
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    font-family: "Courier New", "Consolas", "SimSun", monospace;
    font-size:13px;
    line-height:1.4;
    background:#000;
    overflow:hidden;
  }
  #bios-root {
    width:100vw;
    height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    font-family:"Courier New","Consolas","Microsoft YaHei",monospace;
  }
  /* ── 顶部标题栏 ── */
  .top-bar {
    background:var(--title-bg);
    color:var(--title-text);
    text-align:center;
    padding:2px 0;
    font-size:14px;
    font-weight:bold;
    height:28px;
    line-height:24px;
  }
  /* ── Tab导航 ── */
  .tab-strip {
    background:var(--tab-bg);          /* 未选中Tab栏背景：深蓝 */
    display:flex;
    padding:1px 8px 0;
    height:27px;
    align-items:flex-end;
    border-bottom:none;  /* 实机：Tab栏与主内容区直接相连，无额外分隔线 */
  }
  .tab {
    padding:2px 14px 1px;
    font-size:12px;
    color:var(--tab-text);             /* 未选中文字：白 */
    cursor:pointer;
    border:1px solid transparent;
    border-bottom:none;
    margin-right:2px;
    user-select:none;
    background:var(--tab-bg);          /* 未选中背景：深蓝 */
  }
  .tab:hover { color:var(--tab-text); }
  .tab.active {
    background:var(--tab-active-bg);   /* 选中背景：灰 */
    color:var(--tab-active-text);      /* 选中文字：蓝 */
    font-weight:bold;
    position:relative;
    top:1px;
    border:1px solid var(--border-color);
    border-bottom:1px solid var(--tab-active-bg);
  }
  /* ── 主工作区 ── */
  .workspace {
    flex:1;
    display:flex;
    background:var(--main-gray);
    overflow:hidden;
    border:2px solid var(--title-bg);       /* 完整外框 */
    margin:8px 2px;                           /* 上下8px、左右2px内收，蓝色边框更靠近中心 */
  }
  /* 左中面板（信息区） */
  .info-panel {
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border-right:2px solid var(--title-bg);   /* 仅中间分隔线 */
  }
  .info-header {
    background:var(--main-gray);
    padding:2px 10px;
    font-size:12px;
    font-weight:bold;
    color:var(--submenu-text);  /* 蓝色文字 */
    border-bottom:1px solid var(--title-bg);  /* 蓝色分隔线 */
    height:22px;
    line-height:18px;
    text-align:center;
  }
  .info-body {
    flex:1;
    overflow-y:auto;
    padding:4px 8px;
  }
  /* 信息行 */
  .info-row {
    display:flex;
    padding:1px 0;
    font-size:13px;
    min-height:18px;
    align-items:center;
    color:var(--label-text);
    position:relative;
  }
  /* 只读行（text类型）：无交互状态 */
  .info-row.readonly {
    cursor: default;
    pointer-events: none;  /* 完全不可交互：不接收鼠标事件 */
  }
  .info-row.readonly .info-value {
    color: var(--label-text);
  }
  /* 只读行无焦点视觉反馈（实机BIOS：纯灰色行不可交互，无高亮） */
  .info-row.readonly.focused {
    background: transparent;
    outline: none;
  }
  .info-row.focused {
    /* 实机风格：选中项只变文字颜色，无背景高亮，无outline */
  }
  .info-row.focused .info-label {
    color: #ffffff;  /* 选中时标签文字变白 */
  }
  .info-row.focused .info-value {
    color: var(--submenu-text);
  }
  /* 子菜单行：label 默认蓝色（实机风格） */
  .info-row.is-submenu .info-label {
    color: var(--submenu-text);  /* 默认蓝色 */
  }
  /* choice 行：label 默认蓝色 */
  .info-row.is-choice .info-label {
    color: var(--submenu-text);  /* 默认蓝色 */
  }
  .info-row.is-submenu .info-label .submenu-arrow {
    color: var(--submenu-text);  /* ▶箭头也蓝色 */
  }
  /* 选中态：提升 specificity 覆盖默认蓝色 */
  .info-row.focused.is-submenu .info-label,
  .info-row.focused .info-label {
    color: #ffffff;  /* 选中时标签文字变白 */
  }
  /* 选中时箭头保持蓝色，只有文字变白（实机风格） */
  .info-row.focused.is-submenu .info-label .submenu-arrow {
    color: var(--submenu-text);  /* 箭头保持蓝色 */
  }
  .info-label {
    color:var(--label-text);
    width:520px;
    flex-shrink:0;
  }
  .info-value {
    color:var(--value-text);
    font-weight:bold;
    flex:1;
  }
  .info-value.editable {
    /* 实机风格：无白色背景框，直接显示在灰色背景上 */
    padding:0 4px;
    cursor:pointer;
    display:inline-block;
    min-width:80px;
    position:relative;  /* 让 inline-picker 以此为定位参照，left:0 对齐值文字左边缘 */
  }
  /* choice 值文字默认蓝色（如"选择语言"的 <中文>），选中时变白 */
  .info-value.choice-value {
    color: var(--submenu-text);        /* 默认蓝色 */
  }
  .info-row.focused .info-value.choice-value {
    color: #ffffff;                     /* 选中时变白 */
    font-weight:bold;
  }
  .info-value.highlight {
    /* 实机风格：始终蓝底白字高亮（action行固定高亮） */
    background: var(--title-bg);
    color: #ffffff;
    padding: 1px 8px;
    border: 1px solid var(--title-bg);
    display: inline-block;
    font-weight: bold;
  }
  /* 子项缩进 */
  .sub-row {
    display:flex;
    padding:0 0 0 24px;
    font-size:12px;
    min-height:16px;
    color:var(--label-text);
  }
  .sub-row .s-label { width:140px; flex-shrink:0; }
  .sub-row .s-value { color:var(--value-text); }
  /* 展开项 */
  .expandable {
    cursor:pointer;
    color:var(--submenu-text);
  }
  .expandable:hover { text-decoration:underline; }
  /* ▶符号 */
  .arrow {
    color:var(--arrow-color);
    margin-right:4px;
  }
  /* 子菜单箭头 */
  .submenu-arrow {
    color:var(--submenu-text);
    font-weight:bold;
    cursor:pointer;
    display:inline-block;
    min-width:20px;
    text-align:left;
  }
  /* 箭头纯视觉指示，不参与交互 */
  .submenu-arrow {
    pointer-events: none;
  }
  /* 弹出式选择器（frame_0012风格：垂直下拉框，蓝色边框，灰底） */
  .inline-picker {
    position:fixed;                       /* 视口绝对定位，脱离所有层叠上下文 */
    padding:0;
    display:flex;
    flex-direction:column;
    background:var(--popup-bg);
    border:1px solid var(--popup-border);
    border-left:3px solid var(--popup-border);
    z-index:200;
    font-size:13px;
    min-width:80px;
    box-shadow:2px 2px 4px rgba(0,0,0,0.3);
  }
  .inline-option {
    padding:2px 12px;
    cursor:pointer;
    color:var(--popup-unselected-text);
    white-space:nowrap;
    background:var(--popup-bg);
    text-align:left;
  }
  .inline-option:hover {
    background:var(--popup-selected-bg);
    color:var(--popup-selected-text);
  }
  .inline-option.selected {
    background:var(--popup-selected-bg);
    color:var(--popup-selected-text);
    font-weight:bold;
  }
  /* 右侧面板（帮助） */
  .help-panel {
    width:260px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    background:var(--main-gray);
    border-left:2px solid var(--title-bg);    /* 左侧竖线（加深） */
    border-right:2px solid var(--title-bg);   /* 右侧竖线 */
    border-top:2px solid var(--title-bg);     /* 顶部横线 */
    border-bottom:2px solid var(--title-bg);  /* 底部横线 */
  }
  .help-header {
    background:var(--main-gray);
    padding:3px 8px;
    font-size:12px;
    font-weight:bold;
    color:var(--label-text);
    border-bottom:2px solid var(--title-bg);  /* 标题与内容明显分隔 */
    height:22px;
    line-height:16px;
    text-align:center;
  }
  .help-body {
    flex:1;
    padding:6px 8px;
    font-size:12px;
    line-height:1.5;
    color:var(--help-text);
    overflow-y:auto;
  }
  .help-item-title {
    font-weight:bold;
    color:var(--submenu-text);
    margin-bottom:4px;
  }
  /* ── 底部栏 ── */
  .bottom-bar {
    background:var(--footer-bg);
    color:var(--footer-text);
    padding:2px 10px;
    font-size:11px;
    display:flex;
    justify-content:space-between;
    height:25px;
    align-items:center;
    /* border-top 已移除：黑色间隙由 workspace 的 border-bottom 承担 */
  }
  .bottom-bar .hotkey { color:var(--footer-text); font-weight:bold; }
  .bottom-section { display:flex; gap:16px; }
  /* 版权 */
  .copyright {
    background:var(--copyright-bg);
    color:var(--copyright-text);
    text-align:center;
    padding:2px;
    font-size:10px;
    height:15px;
    line-height:11px;
  }
  /* 滚动条 */
  ::-webkit-scrollbar { width:10px; }
  ::-webkit-scrollbar-track { background:#999; border:1px inset #808080; }
  ::-webkit-scrollbar-thumb { background:#666; border:1px outset #c0c0c0; }
  /* 选中效果 */
  ::selection { background:var(--title-bg); color:var(--value-text); }
</style>
</head>
<body>
<div id="bios-root">
  <!-- 顶部标题 -->
  <div class="top-bar">百敖ByoCore软件 V2.0</div>

  <!-- Tab导航 -->
  <div class="tab-strip" id="tabStrip">
    <div class="tab active" data-tab="home">主页</div>
    <div class="tab" data-tab="device">设备</div>
    <div class="tab" data-tab="advanced">高级</div>
    <div class="tab" data-tab="security">安全</div>
    <div class="tab" data-tab="boot">启动</div>
    <div class="tab" data-tab="exit">退出</div>
    <div class="tab" data-tab="search">搜索</div>
  </div>

  <!-- 搜索栏 -->
  <div id="searchBar" style="display:none;background:var(--main-gray);padding:4px 8px;border-bottom:1px solid var(--border-color);">
    <span style="font-size:12px;font-weight:bold;color:var(--label-text);">搜索:</span>
    <input type="text" id="searchInput" style="width:200px;padding:2px 4px;font-size:12px;font-family:inherit;border:1px inset var(--border-color);background:#c0c0c0;">
    <button onclick="doSearch()" style="padding:2px 8px;font-size:11px;font-family:inherit;border:1px outset var(--border-color);background:#d0d0d0;cursor:pointer;">查找</button>
  </div>

  <!-- 主工作区 -->
  <div class="workspace">
    <!-- 左中信息面板 -->
    <div class="info-panel">
      <div class="info-header" id="infoHeader" style="display:none;"></div>
      <div class="info-body" id="infoBody"></div>
    </div>
    <!-- 右侧帮助面板 -->
    <div class="help-panel">
      <div class="help-header">帮助信息</div>
      <div class="help-body" id="helpBody">
        <div class="help-item-title" id="helpTitle">主页</div>
        <div id="helpText">显示系统基本信息和可配置选项。</div>
      </div>
    </div>
  </div>

  <!-- 底部快捷键栏 -->
  <div class="bottom-bar" style="position:relative;">
    <div class="bottom-section">
      <span><span class="hotkey">F1</span> 帮助</span>
      <span><span class="hotkey">Esc</span> 退出</span>
    </div>
    <div class="bottom-section" style="position:absolute;left:50%;transform:translateX(-50%);">
      <span><span class="hotkey">↑↓</span> 选项条目</span>
      <span><span class="hotkey">←→</span> 选择菜单</span>
      <span><span class="hotkey">+/-</span> 更改设置</span>
      <span><span class="hotkey">Enter</span> 选择子菜单</span>
    </div>
    <div class="bottom-section">
      <span><span class="hotkey">F9</span> 默认值</span>
      <span><span class="hotkey">F10</span> 保存并退出</span>
    </div>
  </div>

  <!-- 版权行 -->
  <div class="copyright">Copyright © 1998-2025 ByoCore Software Co., Ltd.</div>
</div>

<script>
// ==================== 数据结构 ====================

      { type:'text', label:'扩展ROM基地址寄存器(Expansion Rom BAR)', value:'N/A' },
      { type:'text', label:'最大链路带宽(Max Link Width)', value:'x1' },
      { type:'text', label:'最大链路速率(Max Link Speed)', value:'Gen1(2.5GT/s)' },
      { type:'text', label:'链路带宽(Link Width)', value:'x1' },
      { type:'text', label:'链路速率(Link Speed)', value:'Gen1(2.5GT/s)' }
    ]
  }
};

// ==================== 状态 ====================
let currentTab = 'home';          // 当前Tab（顶部导航）
let currentRenderedPage = 'home'; // 当前实际渲染的页面（可能为子页面）
let historyStack = [];
let focusedRowIdx = 0;
let actionRows = []; // 当前页可交互行索引
let activePicker = null; // 当前打开的弹出选择器

// ==================== Tab显示控制 ====================
function updateTabVisibility(pageName) {
  const allTabs = document.querySelectorAll('.tab');
  if (biosData[pageName]) {
    // 一级页面：所有Tab恢复可见
    allTabs.forEach(t => {
      t.style.visibility = '';
      t.style.opacity = '';
    });
  } else if (subPages[pageName]) {
    // 子页面：只显示所属父Tab，其他Tab隐藏但保留占位（位置不变）
    const parentTab = findParentTab(pageName);
    allTabs.forEach(t => {
      if (t.dataset.tab === parentTab) {
        t.style.visibility = '';
        t.style.opacity = '';
        t.classList.add('active');
      } else {
        t.style.visibility = 'hidden';
        t.style.opacity = '0';
      }
    });
  }
}

function findParentTab(subPageName) {
  // 遍历biosData查找哪个一级页面包含指向该子页面的submenu
  for (const [tabName, tabData] of Object.entries(biosData)) {
    if (tabData.items) {
      for (const item of tabData.items) {
        if (item.type === 'submenu' && item.target === subPageName) {
          return tabName;
        }
      }
    }
  }
  // 三级子页面：在subPages中查找哪个子页面包含指向该三级页面的submenu
  for (const [pageName, pageData] of Object.entries(subPages)) {
    if (pageData.items) {
      for (const item of pageData.items) {
        if (item.type === 'submenu' && item.target === subPageName) {
          // 递归查找该子页面的父Tab
          return findParentTab(pageName);
        }
      }
    }
  }
  return 'home'; // fallback
}

// ==================== Tab切换 ====================
function switchTab(tabName) {
  if (tabName === 'search') {
    document.getElementById('searchBar').style.display = 'flex';
    document.getElementById('searchInput').focus();
    return;
  }
  document.getElementById('searchBar').style.display = 'none';
  currentTab = tabName;
  historyStack = [];
  // Tab样式更新
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabName);
  });
  renderPage(tabName);
}

// Tab点击事件
// ==================== Tab点击事件 ====================
document.getElementById('tabStrip').addEventListener('click', (e) => {
  if (e.target.classList.contains('tab')) {
    const tabName = e.target.dataset.tab;
    if (tabName) switchTab(tabName);
  }
});

// ==================== 获取当前页可交互行 ====================
function getActionItems(pageName) {
  const data = subPages[pageName] || biosData[pageName];
  if (!data || !data.items) return [];
  return data.items.filter(item =>
    item.type === 'choice' || item.type === 'input' ||
    item.type === 'action' || item.type === 'submenu'
  );
}

function getActionItemCount(pageName) {
  return getActionItems(pageName).length;
}

// ==================== 激活行焦点 ====================
function focusRow(idx) {
  const rows = document.querySelectorAll('#infoBody .info-row');
  rows.forEach((r, i) => {
    r.classList.toggle('focused', i === idx);
  });
  if (idx >= 0 && idx < rows.length) {
    rows[idx].scrollIntoView({ block: 'nearest' });
  }
}

// ==================== 行操作 ====================
function getFocusedItem() {
  const rows = document.querySelectorAll('#infoBody .info-row');
  const row = rows[focusedRowIdx];
  if (!row) return null;
  const idx = parseInt(row.dataset.idx);
  const data = subPages[currentRenderedPage] || biosData[currentRenderedPage];
  if (!data || !data.items) return null;
  return data.items[idx];
}

function getRenderedData() {
  return subPages[currentRenderedPage] || biosData[currentRenderedPage];
}

function activateFocusedRow() {
  const item = getFocusedItem();
  if (!item) return;

  if (item.type === 'choice') {
    // 展开行内选择器
    const rows = document.querySelectorAll('#infoBody .info-row');
    const row = rows[focusedRowIdx];
    const valEl = row.querySelector('.info-value');
    if (valEl) {
      openInlinePicker(valEl, item.options, item.value, (newVal) => {
        item.value = newVal;
        valEl.textContent = newVal;
        valEl.dataset.current = newVal;
      });
    }
  } else if (item.type === 'submenu') {
    if (item.target) {
      historyStack.push(currentTab);
      renderPage(item.target);
    }
  } else if (item.type === 'action') {
    alert(`${item.label}: 执行操作`);
  } else if (item.type === 'input') {
    const rows = document.querySelectorAll('#infoBody .info-row');
    const row = rows[focusedRowIdx];
    const valEl = row.querySelector('.info-value');
    openInputDialog(item.label, item.value, (newVal) => {
      item.value = newVal;
      valEl.textContent = newVal;
    });
  }
}

function cycleChoiceValue(delta) {
  const item = getFocusedItem();
  if (!item || item.type !== 'choice') return;

  const opts = item.options;
  const idx = opts.indexOf(item.value);
  let newIdx;
  if (delta > 0) {
    newIdx = idx < opts.length - 1 ? idx + 1 : 0;
  } else {
    newIdx = idx > 0 ? idx - 1 : opts.length - 1;
  }
  const newVal = opts[newIdx];
  item.value = newVal;

  // 更新DOM
  const rows = document.querySelectorAll('#infoBody .info-row');
  const row = rows[focusedRowIdx];
  const valEl = row.querySelector('.info-value');
  if (valEl) valEl.textContent = newVal;
}

// ==================== 渲染页面 ====================
function renderPage(pageName) {
  const data = subPages[pageName] || biosData[pageName];
  if (!data) return;

  // 更新当前渲染的页面名称
  currentRenderedPage = pageName;

  // 更新Tab栏显示（子页面时只显示所属Tab）
  updateTabVisibility(pageName);

  const body = document.getElementById('infoBody');
  const header = document.getElementById('infoHeader');
  const helpTitle = document.getElementById('helpTitle');
  const helpText = document.getElementById('helpText');

  // 子页面显示标题，一级页面隐藏标题
  if (subPages[pageName]) {
    header.style.display = '';
    header.textContent = data.title || data.label || pageName;
  } else {
    header.style.display = 'none';
    header.textContent = '';
  }

  helpTitle.textContent = data.title || data.label || pageName;
  helpText.textContent = data.help || '暂无帮助信息。';

  body.innerHTML = '';
  focusedRowIdx = 0;
  actionRows = []; // 重置可交互行索引

  if (!data.items) return;

  let actionIdx = 0;
  data.items.forEach((item, idx) => {
    if (item.type === 'spacer') {
      body.appendChild(document.createElement('div')).style.height = '20px';
      return;
    }

    if (item.type === 'sub') {
      const row = document.createElement('div');
      row.className = 'sub-row';
      row.innerHTML = `<span class="s-label">${item.label}</span><span class="s-value">${item.value}</span>`;
      body.appendChild(row);
      return;
    }

    const row = document.createElement('div');
    row.className = 'info-row' + (item.type === 'text' ? ' readonly' : '');
    row.dataset.idx = idx;
    row.dataset.type = item.type; // 标记行类型

    const label = document.createElement('span');
    label.className = 'info-label';
    label.textContent = item.label;
    row.appendChild(label);

    const val = document.createElement('span');

    // 鼠标交互：悬停时显示焦点，离开后取消（实机风格）
    row.addEventListener('mouseenter', () => {
      const allRows = document.querySelectorAll('#infoBody .info-row');
      allRows.forEach((r, i) => {
        r.classList.toggle('focused', r === row);
      });
      focusedRowIdx = idx;
      updateHelpOnFocus();
    });
    row.addEventListener('mouseleave', () => {
      row.classList.remove('focused');
      if (focusedRowIdx === idx) {
        focusedRowIdx = -1;
      }
    });

    if (item.type === 'choice') {
      row.classList.add('is-choice');
      val.className = 'info-value editable choice-value';
      val.textContent = item.value;
      val.style.cursor = 'pointer';
      val.dataset.options = JSON.stringify(item.options);
      val.dataset.current = item.value;
      val.addEventListener('click', (e) => {
        e.stopPropagation();
        if (item.target) {
          // 有target时点击进入子页面（如选择语言）
          historyStack.push(currentRenderedPage);
          renderPage(item.target);
        } else {
          // 否则展开行内选择器
          const allRows = document.querySelectorAll('#infoBody .info-row');
          allRows.forEach((r, i) => {
            if (r === row) {
              focusedRowIdx = i;
              r.classList.add('focused');
            } else {
              r.classList.remove('focused');
            }
          });
          openInlinePicker(val, item.options, item.value, (newVal) => {
            item.value = newVal;
            val.textContent = newVal;
            val.dataset.current = newVal;
          });
        }
      });
    } else if (item.type === 'input') {
      row.classList.add('is-choice');
      val.className = 'info-value editable choice-value';
      val.textContent = item.value;
      val.style.cursor = 'pointer';
      val.addEventListener('click', () => {
        openInputDialog(item.label, item.value, (newVal) => {
          item.value = newVal;
          val.textContent = newVal;
        });
      });
    } else if (item.type === 'action') {
      val.className = 'info-value highlight';
      val.textContent = item.value;
      val.style.cursor = 'pointer';
      val.addEventListener('click', () => {
        alert(`${item.label}: 执行操作`);
      });
     } else if (item.type === 'submenu') {
        // 子菜单：▶箭头在label文字左侧（实机风格）
        row.classList.add('is-submenu');
        label.innerHTML = '<span class="submenu-arrow">▶</span>' + item.label;
        val.className = 'info-value';  /* 值列清空，不显示▶ */
        val.textContent = '';  /* 不显示任何值 */
        row.style.cursor = 'pointer';
        row.addEventListener('click', () => {
          if (item.target) {
            historyStack.push(currentRenderedPage);
            renderPage(item.target);
          }
        });
    } else {
      // text 类型：只读信息（支持 \n 换行）
      val.className = 'info-value';
      // 将 \n 转为 <br> 以支持多行显示（如内存插槽详细信息）
      val.innerHTML = item.value.replace(/\n/g, '<br>');
      val.style.color = 'var(--label-text)';
    }

    row.appendChild(val);
    body.appendChild(row);
  });

  // 进入页面时无默认焦点，保持页面干净（实机风格）
  focusedRowIdx = -1;
  const allRows = document.querySelectorAll('#infoBody .info-row');
  allRows.forEach((r) => r.classList.remove('focused'));
}

// ==================== 弹出式选择器（frame_0012风格） ====================
function openInlinePicker(targetElement, options, current, callback) {
  const existing = document.getElementById('activeInlinePicker');
  if (existing) existing.remove();

  const listDiv = document.createElement('div');
  listDiv.className = 'inline-picker';
  listDiv.id = 'activeInlinePicker';

  let selectedIdx = options.indexOf(current);
  if (selectedIdx < 0) selectedIdx = 0;

  let isPicking = false;  // 防重入标志

  function renderOptions() {
    listDiv.innerHTML = '';
    options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'inline-option' + (i === selectedIdx ? ' selected' : '');
      div.textContent = opt;
      // 鼠标悬停高亮（不重建DOM，仅修改class，避免事件丢失）
      div.addEventListener('mouseenter', () => {
        if (selectedIdx === i) return;
        selectedIdx = i;
        // 仅更新class，不重建DOM，避免click事件丢失
        const allOpts = listDiv.querySelectorAll('.inline-option');
        allOpts.forEach((o, idx) => {
          if (idx === selectedIdx) {
            o.classList.add('selected');
          } else {
            o.classList.remove('selected');
          }
        });
      });
      // 使用 mousedown 替代 click，确保在 document click 之前执行
      div.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (isPicking) return;
        isPicking = true;
        // 延迟执行回调和关闭，确保 mousedown 完全处理完毕
        requestAnimationFrame(() => {
          callback(opt);
          closePicker();
        });
      });
      listDiv.appendChild(div);
    });
  }

  function closePicker() {
    if (!listDiv.parentNode) return; // 已关闭则忽略
    listDiv.remove();
    document.removeEventListener('keydown', pickerKeyHandler);
    document.removeEventListener('click', closeOnClickOutside);
    document.removeEventListener('mousedown', closeOnMouseDownOutside);
    activePicker = null;
    isPicking = false;
  }

  function pickerKeyHandler(e) {
    // 阻止事件冒泡到 bindKeyboard，防止重复触发
    e.stopPropagation();
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIdx = (selectedIdx + 1) % options.length;
      renderOptions();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIdx = (selectedIdx - 1 + options.length) % options.length;
      renderOptions();
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (isPicking) return;
      isPicking = true;
      callback(options[selectedIdx]);
      closePicker();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closePicker();
    }
  }

  function closeOnClickOutside(e) {
    if (isPicking) return;
    if (!listDiv.contains(e.target) && e.target !== targetElement) {
      closePicker();
    }
  }

  function closeOnMouseDownOutside(e) {
    if (isPicking) return;
    if (!listDiv.contains(e.target) && e.target !== targetElement) {
      closePicker();
    }
  }

  renderOptions();
  document.body.appendChild(listDiv);
  activePicker = { close: closePicker };

  // 计算绝对位置：紧贴 targetElement 左下角
  const rect = targetElement.getBoundingClientRect();
  listDiv.style.left = rect.left + 'px';
  listDiv.style.top = rect.bottom + 'px';

  // 绑定事件
  document.addEventListener('keydown', pickerKeyHandler);
  document.addEventListener('click', closeOnClickOutside);
  document.addEventListener('mousedown', closeOnMouseDownOutside);
}

function openInputDialog(title, current, callback) {
  const newVal = prompt(title + '：', current.replace(/[\[\]]/g, ''));
  if (newVal !== null) {
    callback('[' + newVal + ']');
  }
}

// ==================== 搜索 ====================
function doSearch() {
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  if (!keyword) return;

  const results = [];
  for (const [key, data] of Object.entries(biosData)) {
    if (data.items) {
      data.items.forEach(item => {
        if (item.label && item.label.toLowerCase().includes(keyword)) {
          results.push({ page: key, label: item.label, type: '主菜单' });
        }
      });
    }
  }
  for (const [key, data] of Object.entries(subPages)) {
    if (data.items) {
      data.items.forEach(item => {
        if (item.label && item.label.toLowerCase().includes(keyword)) {
          results.push({ page: key, label: item.label, type: data.title });
        }
      });
    }
  }

  const body = document.getElementById('infoBody');
  const header = document.getElementById('infoHeader');
  const helpText = document.getElementById('helpText');
  body.innerHTML = '';
  header.style.display = '';
  header.textContent = '搜索结果';
  document.getElementById('helpTitle').textContent = '搜索结果';
  helpText.textContent = `找到 ${results.length} 个匹配项。`;

  body.innerHTML = `<div style="padding:8px;font-weight:bold;color:var(--label-text);">关键词 "${keyword}"：${results.length} 个结果</div>`;

  results.forEach(r => {
    const row = document.createElement('div');
    row.className = 'info-row';
    row.style.cursor = 'pointer';
    row.innerHTML = `<span class="info-label">${r.label}</span><span class="info-value" style="font-size:11px;color:var(--help-text)">${r.type}</span>`;
    row.addEventListener('click', () => {
      for (const [tabKey, tabData] of Object.entries(biosData)) {
        if (tabData.items) {
          const found = tabData.items.find(item => item.target === r.page);
          if (found) {
            switchTab(tabKey);
            historyStack.push(tabKey);
            renderPage(r.page);
            return;
          }
        }
      }
      // 直接跳转
      historyStack.push('home');
      renderPage(r.page);
    });
    body.appendChild(row);
  });
}

// ==================== 键盘支持 ====================
function bindKeyboard() {
  document.addEventListener('keydown', (e) => {
    // 弹出选择器打开时，不处理主导航按键
    if (activePicker) return;

    const tabs = ['home','device','advanced','security','boot','exit','search'];
    const idx = tabs.indexOf(currentTab);
    const rows = document.querySelectorAll('#infoBody .info-row');

    if (e.key === 'ArrowLeft') {
      if (idx > 0) switchTab(tabs[idx - 1]);
    } else if (e.key === 'ArrowRight') {
      if (idx < tabs.length - 1) switchTab(tabs[idx + 1]);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (focusedRowIdx === -1) {
        // 从没有焦点开始：跳到最后一个可交互行
        for (let i = rows.length - 1; i >= 0; i--) {
          if (!rows[i].classList.contains('readonly')) {
            focusedRowIdx = i;
            focusRow(i);
            break;
          }
        }
      } else if (focusedRowIdx > 0) {
        focusedRowIdx--;
        // 如果跳到只读行，继续向上找可交互行
        while (focusedRowIdx > 0 && rows[focusedRowIdx] && rows[focusedRowIdx].classList.contains('readonly')) {
          focusedRowIdx--;
        }
        // 如果最终停在只读行，跳过
        if (rows[focusedRowIdx] && !rows[focusedRowIdx].classList.contains('readonly')) {
          focusRow(focusedRowIdx);
        }
      }
      updateHelpOnFocus();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (focusedRowIdx === -1) {
        // 从没有焦点开始：跳到第一个可交互行
        for (let i = 0; i < rows.length; i++) {
          if (!rows[i].classList.contains('readonly')) {
            focusedRowIdx = i;
            focusRow(i);
            break;
          }
        }
      } else if (focusedRowIdx < rows.length - 1) {
        focusedRowIdx++;
        // 如果跳到只读行，继续向下找可交互行
        while (focusedRowIdx < rows.length - 1 && rows[focusedRowIdx] && rows[focusedRowIdx].classList.contains('readonly')) {
          focusedRowIdx++;
        }
        // 如果最终停在只读行，跳过
        if (rows[focusedRowIdx] && !rows[focusedRowIdx].classList.contains('readonly')) {
          focusRow(focusedRowIdx);
        }
      }
      updateHelpOnFocus();
    } else if (e.key === 'Enter') {
      if (focusedRowIdx >= 0) activateFocusedRow();
    } else if (e.key === '+' || e.key === '=') {
      e.preventDefault();
      if (focusedRowIdx >= 0) cycleChoiceValue(1);
    } else if (e.key === '-' || e.key === '_') {
      e.preventDefault();
      if (focusedRowIdx >= 0) cycleChoiceValue(-1);
    } else if (e.key === 'Escape') {
      if (historyStack.length > 0) {
        const prev = historyStack.pop();
        renderPage(prev);
      } else {
        if (confirm('确定要退出BIOS吗？')) alert('已退出BIOS');
      }
    } else if (e.key === 'F1') {
      alert('使用↑↓选择项目，←→切换Tab，Enter进入子菜单或打开选择器，+/-切换选项值，Esc返回上级或退出。');
    } else if (e.key === 'F9') {
      if (confirm('恢复所有默认设置？')) location.reload();
    } else if (e.key === 'F10') {
      if (confirm('保存更改并退出？')) alert('已保存并退出');
    }
  });
}

// 根据当前焦点行更新帮助信息
function updateHelpOnFocus() {
  const item = getFocusedItem();
  if (item && item.help) {
    document.getElementById('helpText').textContent = item.help;
  }
}

// ==================== 启动 ====================
function init() {
  renderPage('home');
  bindKeyboard();
}
init();
